<svg id='add_layer_off' viewBox='0 0 28 28' xmlns='http://www.w3.org/2000/svg'>
	<defs>
		<filter id="shadow_1">
			<feDropShadow stdDeviation="0.2" dy="0.4" dx="0.2"/>
		</filter>
		<filter id='shadow_2' x='-50%' y='-50%' width='200%' height='200%' filterUnits='userSpaceOnUse'>
			<feDropShadow stdDeviation='0.2' dy='0.4' dx='0.2'/>
		</filter>
		<style>
			*:not(rect){ 
				border: 0.001rem solid transparent;
				height: 1.75rem;
				width: 1.75rem;
			}
			.base-style{
				fill: none;
				fill-rule:evenodd;
				stroke:#000000;
				stroke-width:2px;
				stroke-linecap:butt;
				stroke-linejoin:miter;
				stroke-opacity:1; 
			}
			.circle-1{
				fill: #d94343; 
				stroke:	#6d604c;
				stroke-width: 0.8px;
			}
			.style-1{
				fill:#f6ff93;
				stroke:#b795a3;
				stroke-width:0.05px;
			}
			.style-2{
				fill:#dddddd;
				stroke:#342610;
				stroke-width: 0.9px;
			}
			.style-3{
				stroke:#d94343;
				stroke-width:0.7px;
				filter:url(#shadow_2);
			}
			.style-4{
				fill:#ffc26d;
				stroke:#342610;
				stroke-width:0.1px;
				filter:url(#shadow_2);
			}
			.style-5{
				fill:#f3f4f9;
				stroke:#342610;
				stroke-width:0.5px;
			}
			.text-style{
				font-size:6.9px;
				font-family:Tahoma;
				fill:#d94343;
				stroke: #020824;
				stroke-width:0.02rem;
				filter:url(#shadow_1);
			}
		</style>
	</defs>
		<g>
		<path d='M0 0h28v28H0z'  stroke='none' fill='none' />
		<rect class='base-style style-1' x='.5' y='.5' width='27' height='27' rx='2.5'/>
		<g>
			<text class='text-style' x='3.0' y='8'>OFF</text>
			<rect class='base-style style-4' x='17' y='2' width='8.0' height='8.0' rx='2' />
			<line class='base-style style-3' x1='18.4' y1='3.5' x2='23.4' y2='8.0' />
			<line class='base-style style-3' x1='23.4' y1='3.5' x2='18.4' y2='8.0' />
			<circle class='base-style circle-1' cx='6.5' cy='15' r='2.5'/>
			<line class='base-style style-2' x1='11.5' y1='17' x2='25.0' y2='17' />
			<circle class='base-style circle-1' cx='6.5' cy='23' r='2.5'/>
