<svg id='position_inside' viewBox='0 0 28 28' xmlns='http://www.w3.org/2000/svg'>
	<defs>
		<filter id="shadow_1">
			<feDropShadow stdDeviation="0.2" dy="0.4" dx="0.2"/>
		</filter>
		<filter id='shadow_2' x='-50%' y='-50%' width='200%' height='200%' filterUnits='userSpaceOnUse'>
			<feDropShadow stdDeviation='0.2' dy='0.4' dx='0.2'/>
		</filter>
		<style>
			*:not(rect){ 
				border: 0.0001rem solid transparent;
				height: 1.75rem;
				width: 1.75rem;
			}
			.base-style{
				fill: none;
				fill-rule:evenodd;
				stroke:#000000;
				stroke-width:2px;
				stroke-linecap:butt;
				stroke-linejoin:miter;
				stroke-opacity:1; 
			}
			.circle-1{
				fill: #afafae; 
				stroke:	#6d604c;
				stroke-width: 0.8px;
			}
			.style-1{
				fill:#dbff8c;
				stroke:#b795a3;
				stroke-width:0.05px;
			}
			.style-2{
				stroke-width: 0.8px;
				stroke:#6d604c;
				filter:url(#shadow_2);
			}
		</style>
	</defs>
	<g>
		<path d='M0 0h28v28H0z' stroke='none' fill='none' />
		<rect class='base-style style-1' x='.5' y='.5' width='27' height='27' rx='2.5'/>
		<g>
			<circle class='base-style circle-1' cx='5.5' cy='8' r='2.5'/>
			<line class='base-style style-2' x1='10' y1='10' x2='25' y2='10' />
			<line class='base-style style-2' x1='3' y1='16' x2='25' y2='16' />
			<line class='base-style style-2' x1='3' y1='22' x2='25' y2='22' />
		</g><!--g2-->
	</g><!--g1-->
</svg>